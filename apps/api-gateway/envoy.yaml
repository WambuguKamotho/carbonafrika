static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                http_filters:
                  # Rate limiting filter
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 100
                        tokens_per_fill: 100
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append: false
                          header:
                            key: x-local-rate-limit
                            value: "true"
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: carbonafrika_api
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: GET, POST, PATCH, PUT, DELETE, OPTIONS
                        allow_headers: authorization, content-type, x-requested-with
                        expose_headers: x-local-rate-limit
                        max_age: "1728000"
                      routes:
                        # Health check
                        - match: { prefix: "/health" }
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok","service":"api-gateway"}'

                        # Auth service
                        - match: { prefix: "/api/auth" }
                          route:
                            cluster: auth_service
                            prefix_rewrite: "/auth"
                            timeout: 10s
                            retry_policy:
                              retry_on: 5xx
                              num_retries: 2

                        # Project service
                        - match: { prefix: "/api/projects" }
                          route:
                            cluster: project_service
                            prefix_rewrite: "/projects"
                            timeout: 15s
                            retry_policy:
                              retry_on: 5xx
                              num_retries: 2

                        # Marketplace service
                        - match: { prefix: "/api/marketplace" }
                          route:
                            cluster: marketplace_service
                            prefix_rewrite: "/marketplace"
                            timeout: 15s
                            retry_policy:
                              retry_on: 5xx
                              num_retries: 2

                        # Verification service
                        - match: { prefix: "/api/verifications" }
                          route:
                            cluster: verification_service
                            prefix_rewrite: "/verifications"
                            timeout: 15s

                        # 404 fallback
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"success":false,"error":"Not found"}'

  clusters:
    - name: auth_service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: auth_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth-service
                      port_value: 3001
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"

    - name: project_service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: project_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: project-service
                      port_value: 3002
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"

    - name: marketplace_service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: marketplace_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: marketplace-service
                      port_value: 3003
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"

    - name: verification_service
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: verification_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: verification-service
                      port_value: 3004
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
