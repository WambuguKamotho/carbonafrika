# Production stack for kabon.africa — full Phase 2.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Networking model: Caddy is the ONLY container that binds host ports (80/443).
# Every other container is on the private default Docker network and is reached
# by service name (e.g. http://auth-service:3001) — never from the internet.
# This is why the ufw rules only need 22/80/443.
#
# Config & secrets come from ./.env (gitignored). `env_file: .env` hands the
# whole file to each service; it uses the vars it needs and ignores the rest.

services:
  # ── Stateful tier (persistent volumes so data survives restarts) ──────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbonafrika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-carbonafrika}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbonafrika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # persist BullMQ queues
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── HTTP microservices (internal only; reached via the gateway) ───────────
  auth-service:
    build: { context: ., dockerfile: apps/auth-service/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    expose: ["3001"]

  project-service:
    build: { context: ., dockerfile: apps/project-service/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["3002"]

  marketplace-service:
    build: { context: ., dockerfile: apps/marketplace-service/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["3003"]

  verification-service:
    build: { context: ., dockerfile: apps/verification-service/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["3004"]

  iot-service:
    build: { context: ., dockerfile: apps/iot-service/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["3005"]

  # ── Background workers (BullMQ; no HTTP port) ─────────────────────────────
  notification-service:
    build: { context: ., dockerfile: apps/notification-service/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  # ── Public API entrypoint (api.kabon.africa → here) ───────────────────────
  gateway:
    build: { context: ., dockerfile: apps/gateway/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      - auth-service
      - project-service
      - marketplace-service
      - verification-service
      - iot-service
    expose: ["8080"]

  # ── Web app (kabon.africa). NEXT_PUBLIC_* are baked at build time. ────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kabon.africa}
        NEXT_PUBLIC_POLYGON_CHAIN_ID: ${NEXT_PUBLIC_POLYGON_CHAIN_ID:-80002}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose: ["3000"]

  # ── AI Quant Bot (Telegram alerts + FastAPI signal dashboard) ────────────
  quant-bot:
    build:
      context: apps/quant-bot
      dockerfile: Dockerfile
    command: python telegram_listener.py
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/db/bot.db
    volumes:
      - quant_db:/app/db
      - quant_outputs:/app/outputs
      - quant_logs:/app/logs
      - ./apps/quant-bot/config.yaml:/app/config.yaml:ro
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/signals"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Blog (blog.kabon.africa — WordPress + MariaDB) ───────────────────────
  blog-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BLOG_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${BLOG_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${BLOG_DB_PASSWORD}
    volumes:
      - blog_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  blog:
    image: wordpress:6-php8.2-fpm-alpine
    restart: unless-stopped
    depends_on:
      blog-db: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: blog-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: ${BLOG_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${BLOG_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - blog_data:/var/www/html
    expose: ["9000"]

  blog-nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - blog
    volumes:
      - blog_data:/var/www/html:ro
      - ./blog-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]

  # ── Edge: TLS termination + routing (the only public container) ───────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Use $$ in the server .env to escape literal $ in the bcrypt hash,
      # e.g. QUANT_PASSWORD_HASH=$$2a$$14$$...  Docker Compose converts $$ → $
      - QUANT_USERNAME=${QUANT_USERNAME:-admin}
      - QUANT_PASSWORD_HASH=${QUANT_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # persists issued TLS certificates
      - caddy_config:/config
    depends_on:
      - web
      - gateway
      - quant-bot
      - blog-nginx

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  quant_db:
  quant_outputs:
  quant_logs:
  blog_db:
  blog_data:
